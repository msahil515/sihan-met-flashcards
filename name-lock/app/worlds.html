<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06242C">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Name Lock: Worlds</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Name Lock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icon.svg">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="worlds.css">
</head>
<body>
<div id="mapwrap"><div id="map"><img src="assets/memory-city.webp" alt="" draggable="false"></div></div>
<canvas id="motes" aria-hidden="true"></canvas>

<div id="ui">
  <header id="top">
    <div class="crest" id="p-ring"><b id="p-lv">1</b></div>
    <div class="who">
      <div class="nm"><b id="p-name">Sihan</b><span id="p-rank">Intern</span></div>
      <div class="xpbar"><i id="p-xpf"></i></div>
      <div class="xpnote" id="p-xp">0 XP</div>
    </div>
    <div class="pill streak" id="p-st" title="Day streak"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path fill="url(#g-flame)" d="M12.6 2.2c.6 3.2 4.9 5.3 4.9 10.6a5.6 5.6 0 0 1-11.2.3c0-2.4 1.2-4.1 2.4-5.2.1 2 1 3.2 2.1 3.5-.4-3.3-.3-6.4 1.8-9.2z"/><path fill="#FFF1C2" opacity=".85" d="M12.2 13.4c1.6 1.4 2.6 2.6 2.6 4.2a2.8 2.8 0 0 1-5.6 0c0-1.3.9-2.2 1.6-2.8.1.9.6 1.4 1.1 1.5-.2-1.1-.1-2 .3-2.9z"/></svg><b id="p-stn">0</b><small>days</small></div>
    <button class="iconbtn" id="mute" aria-label="Mute"></button>
  </header>

  <section id="sheet" class="glass">
    <div class="kick" id="w-kick">World 1 of 5</div>
    <h1 id="w-name">Who Said What</h1>
    <p class="tag" id="w-tag"></p>
    <div class="wstats" id="w-stats"></div>
    <button class="btn" id="w-go">Enter world</button>
    <footer id="foot">
      <button class="iconbtn arr" id="prev" aria-label="Previous world"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="dots"></div>
      <button class="iconbtn arr" id="next" aria-label="Next world"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </footer>
  </section>
</div>

<div id="intro">
  <canvas id="neuro"></canvas>
  <div id="logo"><b>NAME LOCK</b><span>choose your world</span></div>
  <div id="skip">tap to skip</div>
</div>

<div id="flash"></div>
<div id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F04E78"/><stop offset=".5" stop-color="#FF8257"/><stop offset="1" stop-color="#FFD36B"/></linearGradient>
  </defs>
</svg>

<script>window.SIHAN_SYNC_QUIET = true; window.SIHAN_SYNC_APP = "Name Lock";</script>
<script src="../../sync.js"></script>
<script src="viva.js"></script>
<script src="stats.js"></script>
<script src="sun.js"></script>
<script src="worlds.js"></script>
<script src="pwa.js"></script>
</body>
</html>
