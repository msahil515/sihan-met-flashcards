<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notes for Exam</title>
<meta name="description" content="Sihan's MET 2026 + NIMHANS study notes as one beautiful offline reading library.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes for Exam">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>

<!-- Search overlay -->
<div class="searchpane" id="searchPane">
  <div class="sheet">
    <div class="sbar">
      <span class="sicon">&#128269;</span>
      <input id="searchInput" type="search" placeholder="Search all notes..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="close" id="searchClose" aria-label="Close search">&#10005;</button>
    </div>
    <div class="searchresults" id="searchResults"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
<!-- FS_MODE start -->
<style id="fs-mode-style">
  .fs-toggle{position:fixed;z-index:2147483000;bottom:14px;right:14px;width:46px;height:46px;border:0;border-radius:50%;
    background:rgba(18,24,33,.74);color:#e6edf3;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.5);
    padding:0;opacity:.5;transition:opacity .15s;-webkit-tap-highlight-color:transparent}
  .fs-toggle:hover,.fs-toggle:active{opacity:1}
  @media print{.fs-toggle{display:none}}
  body.fs-active .topbar,
  body.fs-active header,
  body.fs-active nav,
  body.fs-active .app-header,
  body.fs-active .site-header,
  body.fs-active footer{display:none !important}
  body.fs-active{margin:0 !important;padding:0 !important;min-height:100vh}
  body.fs-active main,
  body.fs-active .wrap,
  body.fs-active .container,
  body.fs-active #app,
  body.fs-active .app,
  body.fs-active .page{max-width:100% !important;width:100% !important;margin:0 !important;
    padding-left:12px !important;padding-right:12px !important;padding-top:10px !important;padding-bottom:14px !important}
  @media (orientation:landscape){
    body.fs-active main,
    body.fs-active .wrap,
    body.fs-active .container,
    body.fs-active #app,
    body.fs-active .app,
    body.fs-active .page{padding-top:8px !important;padding-bottom:8px !important;
      padding-left:18px !important;padding-right:18px !important}
  }
</style>
<script>
(function(){
  if(window.__fsModeInit) return; window.__fsModeInit=true;
  var ENTER='\u26F6', EXIT='\u2715';
  function nativeOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  function reqNative(){var el=document.documentElement;var r=el.requestFullscreen||el.webkitRequestFullscreen;
    if(r){try{var p=r.call(el);if(p&&p.catch)p.catch(function(){});}catch(e){}}}
  function exitNative(){if(!nativeOn())return;var x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x){try{x.call(document);}catch(e){}}}
  var btn=document.createElement('button');
  btn.className='fs-toggle';btn.type='button';
  function paint(){var on=document.body.classList.contains('fs-active');
    btn.textContent=on?EXIT:ENTER;btn.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');btn.title=on?'Exit fullscreen':'Fullscreen';}
  function go(){document.body.classList.add('fs-active');reqNative();paint();}
  function stop(){document.body.classList.remove('fs-active');exitNative();paint();}
  function toggle(){document.body.classList.contains('fs-active')?stop():go();}
  btn.addEventListener('click',toggle);
  function mount(){if(!document.body)return;if(!btn.isConnected)document.body.appendChild(btn);paint();}
  if(document.body){mount();}else{document.addEventListener('DOMContentLoaded',mount);}
  function sync(){if(!nativeOn()&&document.body.classList.contains('fs-active')){document.body.classList.remove('fs-active');paint();}}
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
})();
</script>
<!-- FS_MODE end -->
</body>
</html>
