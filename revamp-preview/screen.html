<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test screen preview — new theme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#EEF1F2; --line:#DCE2E3;
  --ink:#17262B; --ink-soft:#425258; --muted:#6C7B80;
  --primary:#0B6E6B; --primary-ink:#08514F; --primary-wash:#E4F0EF;
  --amber:#C77D2E; --amber-wash:#FBEEDD;
  --good:#2E7D5B; --good-wash:#E3F1EA; --bad:#BE4A32; --bad-wash:#F8E7E2;
  --shadow:0 1px 2px rgba(23,38,43,.05), 0 8px 26px rgba(23,38,43,.07);
  --radius:16px; --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-read:'Newsreader',Georgia,serif; --font-display:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1618; --surface:#152124; --surface-2:#1B292C; --line:#26383C;
    --ink:#E7EDED; --ink-soft:#AFC0C1; --muted:#7E9294;
    --primary:#3FB6AF; --primary-ink:#8FE0DA; --primary-wash:#123332;
    --amber:#E0A55C; --amber-wash:#33260F;
    --good:#5FC494; --good-wash:#14312A; --bad:#E58469; --bad-wash:#361D18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
}
.topbar-row{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:600;padding:7px 10px;border-radius:9px}
.back:hover{background:var(--surface-2);color:var(--ink)}
.mock-id{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.mock-id b{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.mock-id span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:1;min-width:60px;display:flex;align-items:center;gap:11px}
.prog-rail{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog-rail>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--primary-ink));transition:width .4s cubic-bezier(.2,.7,.2,1)}
.prog-num{font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:11px;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.no-clock{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.no-clock b{color:var(--primary);font-weight:600}
.run-score{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.05;
  padding:5px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.run-score b{font-family:var(--font-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.run-score b.up{color:var(--good)} .run-score b.down{color:var(--bad)}
.run-score span{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
@media(max-width:640px){.run-score{padding:4px 9px}.run-score b{font-size:14px}}

/* ---------- Layout ---------- */
.stage{max-width:1240px;margin:0 auto;padding:22px 18px 40px;
  display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:26px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:1fr;gap:0}}

/* ---------- Reading pane ---------- */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:30px 34px 26px;min-height:56vh;display:flex;flex-direction:column}
@media(max-width:560px){.reader{padding:22px 18px}}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.q-index{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.q-index b{color:var(--ink);font-size:22px}
.sec-tag{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--primary-ink);background:var(--primary-wash);padding:5px 11px;border-radius:99px}
.flag-pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:8px 13px;border-radius:99px;transition:.15s}
.flag-pill:hover{color:var(--amber);border-color:var(--amber)}
.flag-pill.on{color:var(--amber);background:var(--amber-wash);border-color:var(--amber)}
.flag-pill svg{width:15px;height:15px}
.stem{font-family:var(--font-read);font-size:24px;line-height:1.42;font-weight:400;
  color:var(--ink);letter-spacing:-.005em;margin:0 0 26px}
@media(max-width:560px){.stem{font-size:20.5px}}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:15px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:13px;
  padding:16px 18px;transition:.14s;font-family:var(--font-read);font-size:18px;line-height:1.4;color:var(--ink)}
.opt:hover{border-color:var(--primary);background:var(--primary-wash)}
.opt .key{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-ui);
  font-weight:700;font-size:14px;color:var(--ink-soft);text-transform:uppercase;transition:.14s;margin-top:1px}
.opt.sel{border-color:var(--primary);background:var(--primary-wash)}
.opt.sel .key{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.correct{border-color:var(--good);background:var(--good-wash)}
.opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.reveal{margin-top:22px;border-top:1px dashed var(--line);padding-top:20px;display:none}
.reveal.show{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.reveal-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-ink);margin-bottom:8px}
.reveal p{font-family:var(--font-read);font-size:17.5px;line-height:1.55;color:var(--ink-soft);margin:0}

/* footer controls in reader */
.reader-foot{margin-top:auto;padding-top:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reader-foot .spacer{flex:1}
.linkbtn{background:none;border:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px 6px}
.linkbtn:hover{color:var(--primary)}

/* ---------- Navigator ---------- */
.nav-panel{position:sticky;top:96px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;max-height:calc(100vh - 120px);
  display:flex;flex-direction:column}
.nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav-head h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:15px}
.nav-close{display:none}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:99px;transition:.14s}
.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.filters button b{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px;
  overflow-y:auto;padding:2px;margin:-2px}
.chip{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;
  font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink-soft);
  display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums;transition:.12s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.answered{background:var(--primary-wash);border-color:var(--primary);color:var(--primary-ink)}
.chip.current{outline:2px solid var(--ink);outline-offset:1px}
.chip.flagged::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;
  border-radius:50%;background:var(--amber);border:2px solid var(--surface)}
.chip.hide{display:none}
.legend{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:9px}
.swatch{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none;position:relative}
.swatch.answered{background:var(--primary-wash);border-color:var(--primary)}
.swatch.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
  background:var(--amber);border:2px solid var(--surface)}

/* mobile navigator = bottom sheet */
.nav-toggle-bar{display:none}
@media(max-width:900px){
  .nav-panel{position:fixed;inset:auto 0 0 0;top:auto;z-index:60;max-height:76vh;border-radius:20px 20px 0 0;
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.22)}
  .nav-panel.open{transform:translateY(0)}
  .nav-close{display:inline-flex;background:var(--surface-2);border:none;border-radius:9px;width:30px;height:30px;
    align-items:center;justify-content:center;font-size:17px;color:var(--muted)}
  .nav-scrim{display:none;position:fixed;inset:0;background:rgba(10,18,20,.42);z-index:55}
  .nav-scrim.open{display:block}
  .nav-toggle-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;gap:10px;
    padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .nav-toggle-bar .btn{flex:1;padding:12px}
  .stage{padding-bottom:96px}
}

/* ---------- Results ---------- */
.results{max-width:900px;margin:0 auto;padding:26px 18px 60px;display:none}
.results.show{display:block}
.score-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:34px;text-align:center;position:relative;overflow:hidden}
.score-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--primary),var(--amber))}
.score-eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score-big{font-family:var(--font-display);font-weight:700;font-size:74px;line-height:1;letter-spacing:-.02em;margin:8px 0 2px}
.score-big small{font-size:26px;color:var(--muted);font-weight:500}
.score-sub{color:var(--ink-soft);font-size:15px}
.score-stats{display:flex;justify-content:center;gap:30px;margin-top:22px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--font-display);font-size:26px;font-weight:600}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.g b{color:var(--good)} .stat.r b{color:var(--bad)} .stat.a b{color:var(--amber)}
.sec-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-top:22px}
.sec-block h3{font-family:var(--font-display);font-weight:600;margin:0 0 18px;font-size:18px}
.secrow{display:grid;grid-template-columns:150px 1fr 56px;gap:14px;align-items:center;margin-bottom:14px}
@media(max-width:560px){.secrow{grid-template-columns:110px 1fr 44px}}
.secrow .nm{font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.secrow .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.secrow .track>i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.secrow .pc{text-align:right;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.rev-filters{display:flex;gap:8px;margin:26px 0 14px;flex-wrap:wrap}
.rev-filters button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px}
.rev-filters button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:12px}
.rev-item .rq{font-family:var(--font-read);font-size:18px;line-height:1.4;margin:0 0 14px}
.rev-item .rq b{font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--muted);
  display:block;margin-bottom:7px;letter-spacing:.04em}
.rev-opt{font-family:var(--font-read);font-size:15.5px;padding:9px 13px;border-radius:9px;margin-bottom:6px;
  display:flex;gap:10px;border:1px solid transparent}
.rev-opt .k{font-family:var(--font-ui);font-weight:700;text-transform:uppercase}
.rev-opt.ok{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.rev-opt.no{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.rev-note{font-family:var(--font-read);font-size:16px;line-height:1.55;color:var(--ink-soft);
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tag-you{font-family:var(--font-ui);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:auto;align-self:center}
.tag-you.no{background:var(--bad);color:#fff} .tag-you.ok{background:var(--good);color:#fff}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <a class="back" href="./">← Library</a>
    <div class="mock-id"><b id="mockTitle">MET Mock 2</b><span id="mockSub">180 questions · untimed</span></div>
    <div class="prog">
      <div class="prog-rail"><i id="progFill"></i></div>
      <div class="prog-num" id="progNum">0 / 180</div>
    </div>
    <div class="run-score" id="runScore" title="Running score so far (+1 right / −0.25 wrong)">
      <b id="runScoreVal">0</b><span>score so far</span>
    </div>
    <span class="no-clock">🞰 <b>No clock</b></span>
    <button class="btn primary" id="finishBtn">Finish</button>
  </div>
</div>

<!-- QUIZ -->
<div class="stage" id="quizStage">
  <section class="reader" id="reader"><!-- rendered --></section>

  <aside class="nav-panel" id="navPanel">
    <div class="nav-head">
      <h3>Jump to question</h3>
      <button class="nav-close" id="navClose">✕</button>
    </div>
    <div class="filters" id="navFilters">
      <button data-f="all" class="on">All</button>
      <button data-f="unanswered">Unanswered <b id="cUn">0</b></button>
      <button data-f="flagged">Review <b id="cFl">0</b></button>
      <button data-f="answered">Answered <b id="cAn">0</b></button>
    </div>
    <div class="grid" id="navGrid"></div>
    <div class="legend">
      <div><span class="swatch"></span> Not answered yet</div>
      <div><span class="swatch answered"></span> Answered</div>
      <div><span class="swatch flag"></span> Flagged for review</div>
    </div>
  </aside>
</div>

<div class="nav-scrim" id="navScrim"></div>
<div class="nav-toggle-bar">
  <button class="btn" id="prevBarBtn">← Prev</button>
  <button class="btn" id="openNavBtn">Navigator</button>
  <button class="btn primary" id="nextBarBtn">Next →</button>
</div>

<!-- RESULTS -->
<div class="results" id="results"></div>

<script src="data-all.js"></script>
<script>
/* pick the mock from ?m=<id>; fall back to met-mock-2 (or first available) */
const ALL = window.PREVIEW_MOCKS || {};
const reqId = new URLSearchParams(location.search).get("m");
const MID = (reqId && ALL[reqId]) ? reqId : (ALL["met-mock-2"] ? "met-mock-2" : Object.keys(ALL)[0]);
const M = ALL[MID] || (window.PREVIEW_MOCK || {questions:[],sectionLabels:{},fullTitle:"Mock",sub:""});
M.title = M.fullTitle || M.title || "Mock";
M.sub = M.sub || (M.questions.length + " questions · untimed");
const Q = M.questions, SL = M.sectionLabels, N = Q.length;
const KEY = "revamp-preview-" + MID + "-v1";
const LETTERS = ["a","b","c","d"];

let st = {i:0, answers:{}, flags:{}, revealed:{}, visited:{0:1}, filter:"all"};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.answers){st={...st,...s};st.filter="all";}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

const answeredCount = ()=>Object.keys(st.answers).length;
const flaggedCount = ()=>Object.values(st.flags).filter(Boolean).length;

/* ---------- render question ---------- */
function renderQ(){
  const q = Q[st.i]; st.visited[st.i]=1;
  const sel = st.answers[st.i]||null;
  const revealed = !!st.revealed[st.i];
  const flagged = !!st.flags[st.i];
  const optHtml = LETTERS.map(L=>{
    if(!q.options[L]) return "";
    let cls="opt";
    if(revealed){cls+=" locked";
      if(L===q.correct)cls+=" correct";
      else if(L===sel)cls+=" wrong";
    } else if(sel===L)cls+=" sel";
    return `<button class="${cls}" data-opt="${L}">
      <span class="key">${L}</span><span>${q.options[L]}</span></button>`;
  }).join("");
  document.getElementById("reader").innerHTML = `
    <div class="eyebrow">
      <span class="q-index">Q<b>${st.i+1}</b> / ${N}</span>
      <span class="sec-tag">${SL[q.section]||q.section}</span>
      <button class="flag-pill ${flagged?"on":""}" id="flagBtn">
        <svg viewBox="0 0 24 24" fill="${flagged?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        ${flagged?"Flagged":"Flag for review"}
      </button>
    </div>
    <p class="stem">${q.q}</p>
    <div class="opts">${optHtml}</div>
    <div class="reveal ${revealed?"show":""}" id="revealBox">
      <div class="reveal-tag">Why — answer ${q.correct.toUpperCase()}</div>
      <p>${q.explanation||""}</p>
    </div>
    <div class="reader-foot">
      <button class="btn ghost" id="prevBtn" ${st.i===0?"disabled":""}>← Previous</button>
      <button class="linkbtn" id="clearBtn" style="${sel?"":"display:none"}">Clear answer</button>
      <button class="linkbtn" id="revealBtn">${revealed?"Hide explanation":"Reveal explanation"}</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="skipBtn" style="${st.i===N-1?"display:none":""}">Skip →</button>
      <button class="btn primary" id="nextBtn" style="${st.i===N-1?"display:none":""}">Next →</button>
      <button class="btn primary" id="toFinishBtn" style="${st.i===N-1?"":"display:none"}">Review &amp; finish</button>
    </div>`;

  document.querySelectorAll(".opt").forEach(b=>{
    if(revealed) return;
    b.onclick=()=>{ st.answers[st.i]=b.dataset.opt; save(); renderQ(); syncNav(); updateProg(); };
  });
  document.getElementById("flagBtn").onclick=()=>{st.flags[st.i]=!flagged;save();renderQ();syncNav();};
  document.getElementById("revealBtn").onclick=()=>{st.revealed[st.i]=!revealed;save();renderQ();};
  const clr=document.getElementById("clearBtn"); if(clr) clr.onclick=()=>{delete st.answers[st.i];save();renderQ();syncNav();updateProg();};
  const pv=document.getElementById("prevBtn"); if(pv) pv.onclick=()=>go(st.i-1);
  const sk=document.getElementById("skipBtn"); if(sk) sk.onclick=()=>go(st.i+1);
  const nx=document.getElementById("nextBtn"); if(nx) nx.onclick=()=>go(st.i+1);
  const tf=document.getElementById("toFinishBtn"); if(tf) tf.onclick=finish;
}
function go(i){ if(i<0||i>=N) return; st.i=i; save(); renderQ(); syncNav();
  document.getElementById("reader").scrollIntoView({behavior:"smooth",block:"start"}); }

/* ---------- navigator ---------- */
function buildNav(){
  const g=document.getElementById("navGrid"); g.innerHTML="";
  for(let i=0;i<N;i++){
    const c=document.createElement("button"); c.className="chip"; c.textContent=i+1;
    c.dataset.i=i; c.onclick=()=>{go(i);closeNav();}; g.appendChild(c);
  }
}
function syncNav(){
  document.querySelectorAll(".chip").forEach(c=>{
    const i=+c.dataset.i, ans=st.answers[i]!=null, fl=!!st.flags[i];
    c.classList.toggle("answered",ans);
    c.classList.toggle("flagged",fl);
    c.classList.toggle("current",i===st.i);
    let show=true;
    if(st.filter==="unanswered")show=!ans;
    else if(st.filter==="flagged")show=fl;
    else if(st.filter==="answered")show=ans;
    c.classList.toggle("hide",!show);
  });
  document.getElementById("cUn").textContent=N-answeredCount();
  document.getElementById("cFl").textContent=flaggedCount();
  document.getElementById("cAn").textContent=answeredCount();
}
document.getElementById("navFilters").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  st.filter=b.dataset.f;
  document.querySelectorAll("#navFilters button").forEach(x=>x.classList.toggle("on",x===b));
  syncNav();
};
function updateProg(){
  const a=answeredCount();
  document.getElementById("progFill").style.width=(a/N*100)+"%";
  document.getElementById("progNum").textContent=a+" / "+N;
  updateScore();
}
function updateScore(){
  let right=0,wrong=0;
  for(const k in st.answers){ if(st.answers[k]===Q[+k].correct)right++; else wrong++; }
  const s=right*1 - wrong*0.25;
  const el=document.getElementById("runScoreVal");
  el.textContent=(s>0?"+":"")+ (Math.round(s*100)/100).toString();
  el.className = s>0?"up":(s<0?"down":"");
}

/* mobile sheet */
const panel=document.getElementById("navPanel"), scrim=document.getElementById("navScrim");
function openNav(){panel.classList.add("open");scrim.classList.add("open");}
function closeNav(){panel.classList.remove("open");scrim.classList.remove("open");}
document.getElementById("openNavBtn").onclick=openNav;
document.getElementById("navClose").onclick=closeNav;
scrim.onclick=closeNav;
document.getElementById("prevBarBtn").onclick=()=>go(st.i-1);
document.getElementById("nextBarBtn").onclick=()=>go(st.i+1);

/* ---------- results ---------- */
function finish(){
  let right=0,wrong=0,skipped=0;
  const secAgg={};
  Q.forEach((q,i)=>{
    const s=q.section; secAgg[s]=secAgg[s]||{n:0,c:0};
    secAgg[s].n++;
    const a=st.answers[i];
    if(a==null)skipped++;
    else if(a===q.correct){right++;secAgg[s].c++;}
    else wrong++;
  });
  const score=(right*1 - wrong*0.25);
  const answered=right+wrong;
  const accAnswered=answered?Math.round(right/answered*100):0;
  const secHtml=Object.keys(SL).filter(s=>secAgg[s]).map(s=>{
    const {n,c}=secAgg[s]; const p=Math.round(c/n*100);
    return `<div class="secrow"><div class="nm">${SL[s]}</div>
      <div class="track"><i style="width:${p}%;background:${p>=75?'var(--good)':p>=50?'var(--amber)':'var(--bad)'}"></i></div>
      <div class="pc" style="color:${p>=75?'var(--good)':p>=50?'var(--amber)':'var(--bad)'}">${c}/${n}</div></div>`;
  }).join("");

  const revHtml=Q.map((q,i)=>{
    const a=st.answers[i], ok=a===q.correct, fl=!!st.flags[i];
    const state = a==null?"skipped":(ok?"correct":"wrong");
    const opts=LETTERS.filter(L=>q.options[L]).map(L=>{
      let cls="rev-opt", tag="";
      if(L===q.correct){cls+=" ok";}
      if(L===a&&!ok){cls+=" no";tag=`<span class="tag-you no">your answer</span>`;}
      else if(L===a&&ok){tag=`<span class="tag-you ok">your answer</span>`;}
      return `<div class="${cls}"><span class="k">${L}</span><span>${q.options[L]}</span>${tag}</div>`;
    }).join("");
    return `<div class="rev-item" data-state="${state}" data-flag="${fl?1:0}">
      <p class="rq"><b>Q${i+1} · ${SL[q.section]||q.section}${a==null?" · skipped":ok?"":" · missed"}${fl?" · flagged":""}</b>${q.q}</p>
      ${opts}
      <div class="rev-note">${q.explanation||""}</div></div>`;
  }).join("");

  document.getElementById("quizStage").style.display="none";
  document.querySelector(".nav-toggle-bar").style.display="none";
  document.getElementById("finishBtn").textContent="Back to questions";
  document.getElementById("finishBtn").onclick=backToQuiz;
  const R=document.getElementById("results");
  R.innerHTML=`
    <div class="score-card">
      <div class="score-eyebrow">${M.title} · untimed · scored +1 / −0.25</div>
      <div class="score-big">${score.toFixed(2).replace(/\.00$/,'')}<small> / ${N}</small></div>
      <div class="score-sub">${right} of ${answered} answered right (${accAnswered}%)${skipped?` · ${skipped} left blank`:""}</div>
      <div class="score-stats">
        <div class="stat g"><b>${right}</b><span>Correct</span></div>
        <div class="stat r"><b>${wrong}</b><span>Wrong</span></div>
        <div class="stat"><b>${skipped}</b><span>Skipped</span></div>
        <div class="stat a"><b>${flaggedCount()}</b><span>Flagged</span></div>
      </div>
    </div>
    <div class="sec-block"><h3>Section by section</h3>${secHtml}</div>
    <div class="rev-filters" id="revFilters">
      <button data-r="all" class="on">All ${N}</button>
      <button data-r="wrong">Missed ${wrong}</button>
      <button data-r="skipped">Skipped ${skipped}</button>
      <button data-r="flagged">Flagged ${flaggedCount()}</button>
    </div>
    <div id="revList">${revHtml}</div>
    <div style="text-align:center;margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="backBtn2">← Back to questions</button>
      <button class="btn" id="restartBtn">Restart mock</button>
    </div>`;
  R.classList.add("show");
  window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("revFilters").onclick=e=>{
    const b=e.target.closest("button"); if(!b)return;
    const f=b.dataset.r;
    document.querySelectorAll("#revFilters button").forEach(x=>x.classList.toggle("on",x===b));
    document.querySelectorAll(".rev-item").forEach(it=>{
      let show = f==="all" || (f==="flagged"?it.dataset.flag==="1":it.dataset.state===f);
      it.style.display=show?"":"none";
    });
  };
  document.getElementById("backBtn2").onclick=backToQuiz;
  document.getElementById("restartBtn").onclick=()=>{
    if(!confirm("Clear all answers and flags and start "+M.title+" fresh?"))return;
    st={i:0,answers:{},flags:{},revealed:{},visited:{0:1},filter:"all"};save();
    backToQuiz(); renderQ(); syncNav(); updateProg();
  };
}
function backToQuiz(){
  document.getElementById("results").classList.remove("show");
  document.getElementById("quizStage").style.display="";
  document.querySelector(".nav-toggle-bar").style.display="";
  document.getElementById("finishBtn").textContent="Finish";
  document.getElementById("finishBtn").onclick=finish;
  window.scrollTo({top:0});
}
document.getElementById("finishBtn").onclick=finish;

/* keyboard: 1-4 pick, arrows move, f flag */
document.addEventListener("keydown",e=>{
  if(document.getElementById("results").classList.contains("show"))return;
  if(e.key>="1"&&e.key<="4"){const L=LETTERS[+e.key-1];if(Q[st.i].options[L]&&!st.revealed[st.i]){st.answers[st.i]=L;save();renderQ();syncNav();updateProg();}}
  else if(e.key==="ArrowRight")go(st.i+1);
  else if(e.key==="ArrowLeft")go(st.i-1);
  else if(e.key.toLowerCase()==="f"){st.flags[st.i]=!st.flags[st.i];save();renderQ();syncNav();}
});

/* init */
document.getElementById("mockTitle").textContent=M.title;
document.getElementById("mockSub").textContent=M.sub;
buildNav(); renderQ(); syncNav(); updateProg();
</script>
</body>
</html>
